<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d4673">
<title>MeN-Master | Misi Perpustakaan Misteri</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#17324e;background:#eef6ff;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 7% 0%,#d8f4ff 0,transparent 34%),linear-gradient(145deg,#edf8ff,#f6f5ff)}
.shell{max-width:730px;margin:auto;padding:16px 13px 38px}.mast{background:linear-gradient(123deg,#10578c,#0c3d72 73%,#16457d);color:white;border-radius:24px;padding:23px 22px 20px;box-shadow:0 14px 33px #184d7b28;position:relative;overflow:hidden}.mast:after{content:"📚";position:absolute;right:12px;bottom:-18px;font-size:108px;opacity:.13;transform:rotate(-13deg);pointer-events:none}.brand{font-weight:800;font-size:13px;letter-spacing:.07em;color:#a8ecfb;text-transform:uppercase}.mast h1{font-size:clamp(24px,5vw,33px);line-height:1.13;margin:10px 0 9px;max-width:520px}.mast p{max-width:540px;margin:0;color:#e4f4ff;font-size:14px;line-height:1.6}.topline{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;margin-top:16px}.mini-tag{padding:6px 11px;background:#ffffff23;border:1px solid #ffffff45;border-radius:100px;font-size:12px;font-weight:700}
.status{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0;padding:12px 15px;background:#fff;border:1px solid #dfeefa;border-radius:17px;box-shadow:0 4px 15px #20486b09;flex-wrap:wrap}.status strong{font-size:14px}.status span{font-size:13px;color:#527087}.track{display:flex;align-items:center;gap:7px}.node{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#e9eff5;color:#7c90a4;font-size:15px;font-weight:800;border:2px solid #d6e5f0}.node.on{background:#d9f3ff;color:#1266a5;border-color:#58b8e8}.node.done{background:#dbf8e7;color:#117e4c;border-color:#73d2a1}.line{width:21px;height:3px;background:#dce6ef;border-radius:8px}
.panel{margin-top:14px;background:#fff;border-radius:23px;border:1px solid #dfeaf6;padding:clamp(18px,4vw,28px);box-shadow:0 12px 28px #174b7620}.eyebrow{display:inline-flex;align-items:center;gap:6px;color:#13629a;background:#e4f4ff;padding:7px 12px;border-radius:30px;font-weight:800;font-size:12px;letter-spacing:.02em}.panel h2{font-size:clamp(21px,4.4vw,26px);margin:14px 0 10px;line-height:1.25}.panel p{font-size:15px;line-height:1.65;color:#526c82;margin:0 0 12px}.scene{display:flex;align-items:center;gap:14px;padding:16px;margin:17px 0;background:linear-gradient(110deg,#f2fbff,#eef5ff);border-radius:17px;border:1px solid #d6eafb}.scene .emoji{font-size:37px;flex:0 0 auto}.scene p{margin:0;color:#31516c;font-size:14px}.question{background:#fffaf0;border:1px solid #ffe4ae;border-radius:17px;padding:16px 16px 15px;font-size:17px;font-weight:750;line-height:1.58;margin:16px 0}.choices{display:grid;gap:10px}.choice{width:100%;display:flex;align-items:center;gap:12px;border:2px solid #d8e8f5;background:#fff;color:#173b5a;border-radius:14px;padding:14px;cursor:pointer;text-align:left;font-weight:750;font-size:16px;min-height:52px;transition:transform .12s,border-color .12s,background .12s}.choice:hover:not(:disabled){transform:translateY(-1px);border-color:#5baede;background:#f6fbff}.choice:focus-visible,.primary:focus-visible,.secondary:focus-visible{outline:3px solid #ffb13e;outline-offset:3px}.choice:disabled{cursor:default}.letter{display:grid;place-items:center;width:30px;height:30px;background:#e7f2fc;color:#356b9b;border-radius:10px;font-size:14px;flex-shrink:0}.choice.correct{background:#e6f9ed;border-color:#42ae79;color:#12613c}.choice.wrong{background:#fff0ef;border-color:#ed8a84;color:#99423d}.answerbox{padding:15px;border-radius:15px;background:#edf9ff;border:1px solid #a8dcfa;margin-top:14px;line-height:1.6}.answerbox.positive{background:#e8f9ec;border-color:#94ddb0}.answerbox strong{display:block;margin-bottom:3px}.answerbox p{margin:0;color:#36586e;font-size:14px}.actions{margin-top:18px;display:flex;gap:9px;flex-wrap:wrap}.primary,.secondary{font:inherit;font-weight:800;border-radius:14px;padding:13px 18px;min-height:48px;cursor:pointer}.primary{background:#147cc0;border:2px solid #147cc0;color:#fff;box-shadow:0 6px 15px #147cc031}.primary:hover{background:#0d6ba9}.secondary{background:white;border:2px solid #c5dceb;color:#1a638e}.primary:disabled{opacity:.55;cursor:not-allowed}.center{text-align:center}.center .scene{justify-content:center}.hero-emoji{font-size:65px;display:block;margin:16px auto 8px}.badge-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px auto}.reward{padding:9px 13px;border-radius:13px;background:#eaf7ff;border:1px solid #a6d3ef;font-weight:800;font-size:13px}.explain{font-size:13px;margin-top:14px;color:#55738b;line-height:1.6}.score{font-size:42px;line-height:1.1;color:#126fa9;font-weight:900;margin:8px}.progress{height:9px;background:#e7eff6;border-radius:20px;overflow:hidden;margin:12px 0 18px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#0fb5af,#2191dd);border-radius:20px;transition:width .2s}.small{color:#69829a!important;font-size:13px!important}.footer{text-align:center;color:#7691a7;font-size:12px;margin:20px 0 0}.hidden{display:none!important}
@media(max-width:440px){.mast{padding:19px}.status{padding:10px}.panel{padding:18px}.choice{padding:12px}.primary,.secondary{width:100%}.scene{align-items:flex-start}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
</head>
<body><main class="shell">
<header class="mast"><div class="brand">MeN-Master · Sumber Tambahan</div><h1>📖 Misi Perpustakaan Misteri</h1><p>Selesaikan cabaran awalan meN-, buka tiga pintu dan temui buku rahsia di perpustakaan!</p><div class="topline"><span class="mini-tag">🎮 3 misi</span><span class="mini-tag">✨ 9 soalan</span><span class="mini-tag">📱 Mesra telefon</span></div></header>
<div class="status"><div><strong id="statusText">Sedia untuk bermula?</strong><br><span id="scoreText">Markah: 0/9</span></div><div class="track" aria-label="Kemajuan tiga misi"><div class="node on" id="node0">1</div><div class="line"></div><div class="node" id="node1">2</div><div class="line"></div><div class="node" id="node2">3</div></div></div>
<section class="panel" id="screen" aria-live="polite"></section><p class="footer">Belajar sambil bermain · Setiap jawapan membantu anda maju!</p>
</main>
<script>
'use strict';
const missions=[
 {name:'Pintu 1 · Cari Petunjuk',place:'Pintu Perpustakaan',emoji:'🚪',story:'Cikgu Hana memberi anda peta yang tersembunyi. Jawab tiga soalan untuk mendapat Kunci Biru.',reward:'🔵 Kunci Biru',questions:[
  {q:'Aina ______ peta di atas meja. (lihat)',options:['melihat','menlihat','menglihat'],a:0,why:'Kata dasar lihat bermula dengan huruf l. Bentuk yang digunakan ialah me-: melihat.'},
  {q:'Kumar ______ beg yang berisi buku. (bawa)',options:['menbawa','membawa','mebawa'],a:1,why:'Kata dasar bawa bermula dengan huruf b. Gunakan awalan mem-: membawa.'},
  {q:'Siti ______ petunjuk di dalam buku cerita. (cari)',options:['mencari','memcari','mengkari'],a:0,why:'Kata dasar cari bermula dengan huruf c. Gunakan awalan men-: mencari.'}
 ]},
 {name:'Pintu 2 · Susun Rak',place:'Ruang Buku',emoji:'🗂️',story:'Rak perpustakaan bersepah! Bantu rakan-rakan menyusun buku untuk memperoleh Kunci Emas.',reward:'🟡 Kunci Emas',questions:[
  {q:'Aina ______ buku cerita mengikut warna. (susun)',options:['mensusun','menyusun','mengsusun'],a:1,why:'Huruf s pada kata dasar susun gugur apabila menerima awalan meny-: menyusun.'},
  {q:'Kumar ______ cerita pendek kepada adiknya. (baca)',options:['membaca','menbaca','mebaca'],a:0,why:'Kata dasar baca bermula dengan b. Bentuk yang betul ialah membaca.'},
  {q:'Siti ______ kamus dari rak paling bawah. (ambil)',options:['menambil','memambil','mengambil'],a:2,why:'Kata dasar ambil bermula dengan huruf vokal a. Gunakan awalan meng-: mengambil.'}
 ]},
 {name:'Pintu 3 · Buka Rahsia',place:'Bilik Buku Rahsia',emoji:'🗝️',story:'Hanya tinggal satu pintu! Gunakan pengetahuan peluluhan bunyi untuk membuka peti rahsia.',reward:'🟣 Kunci Rahsia',questions:[
  {q:'Amir ______ jawapan pada kertas. (tulis)',options:['mentulis','menulis','memtulis'],a:1,why:'Huruf t pada kata dasar tulis gugur. Bentuk yang betul ialah menulis.'},
  {q:'Mei Ling ______ buku yang paling menarik. (pilih)',options:['mengpilih','menpilih','memilih'],a:2,why:'Huruf p pada kata dasar pilih gugur. Bentuk yang betul ialah memilih.'},
  {q:'Ravi ______ jumlah buku di dalam peti. (kira)',options:['mengira','mengkira','menkira'],a:0,why:'Huruf k pada kata dasar kira gugur. Bentuk yang betul ialah mengira.'}
 ]}
];
let stage=0,question=0,score=0,answered=false,choiceIndex=-1;let history=[];
const screen=document.getElementById('screen');
const flat=missions.flatMap(m=>m.questions);
function safe(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');}
function updateHeader(){document.getElementById('scoreText').textContent=`Markah: ${score}/9`;document.getElementById('statusText').textContent=history.length===9?'Misi selesai!':`Misi ${stage+1} daripada 3`;for(let i=0;i<3;i++){const n=document.getElementById('node'+i);n.classList.toggle('done',i<stage||history.length===9);n.classList.toggle('on',i===stage&&history.length!==9);n.textContent=(i<stage||history.length===9)?'✓':String(i+1);}}
function start(){stage=0;question=0;score=0;history=[];answered=false;choiceIndex=-1;renderQuestion();}
function intro(){document.getElementById('statusText').textContent='Sedia untuk bermula?';screen.innerHTML=`<div class="center"><span class="eyebrow">🎯 Cabaran Interaktif</span><span class="hero-emoji">🦉📚</span><h2>Selamat datang, Penjelajah Ilmu!</h2><p>Pintu perpustakaan terkunci. Hanya pakar awalan meN- boleh mendapatkan tiga kunci untuk membukanya.</p><div class="scene"><div class="emoji">💡</div><p>Setiap misi ada 3 soalan. Pilih kata berimbuhan yang sesuai dan baca penjelasan selepas menjawab.</p></div><div class="badge-list"><span class="reward">🔵 Kunci Biru</span><span class="reward">🟡 Kunci Emas</span><span class="reward">🟣 Kunci Rahsia</span></div><div class="actions"><button class="primary" id="start">Mula Pengembaraan →</button></div></div>`;document.getElementById('start').addEventListener('click',start);}
function renderQuestion(){answered=false;choiceIndex=-1;updateHeader();let m=missions[stage],d=m.questions[question],count=stage*3+question+1;screen.innerHTML=`<span class="eyebrow">${safe(m.emoji)} ${safe(m.name)}</span><h2>${safe(m.place)}</h2><div class="scene"><span class="emoji">${safe(m.emoji)}</span><p>${safe(m.story)}</p></div><div class="small">Soalan ${count} daripada 9 · ${question+1}/3 dalam misi ini</div><div class="progress" aria-label="Kemajuan soalan"><div style="width:${(count-1)/9*100}%"></div></div><div class="question">${count}. ${safe(d.q)}</div><div class="choices">${d.options.map((opt,i)=>`<button class="choice" type="button" data-answer="${i}"><span class="letter">${'ABC'[i]}</span> ${safe(opt)}</button>`).join('')}</div><div id="reply" aria-live="polite"></div><div class="actions" id="nextBox"></div>`;screen.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>choose(Number(b.dataset.answer))));}
function choose(index){if(answered)return;answered=true;choiceIndex=index;const d=missions[stage].questions[question],correct=index===d.a;history.push({correct,scene:stage,question:d.q});if(correct)score++;screen.querySelectorAll('[data-answer]').forEach(b=>{const i=Number(b.dataset.answer);b.disabled=true;if(i===d.a)b.classList.add('correct');if(i===index&&!correct)b.classList.add('wrong');});document.getElementById('reply').innerHTML=`<div class="answerbox ${correct?'positive':''}"><strong>${correct?'✅ Bagus! Jawapan anda betul.':'🌱 Hampir berjaya! Jawapan betul: '+safe(d.options[d.a])}</strong><p>${safe(d.why)}</p></div>`;document.getElementById('nextBox').innerHTML=`<button class="primary" id="next">${question===2?'Selesaikan Misi →':'Soalan Seterusnya →'}</button>`;document.getElementById('next').addEventListener('click',next);updateHeader();}
function next(){if(question<2){question++;renderQuestion();return;}renderStageEnd();}
function renderStageEnd(){let m=missions[stage],thisScore=history.filter(h=>h.scene===stage&&h.correct).length;screen.innerHTML=`<div class="center"><span class="eyebrow">✅ Misi ${stage+1} Diselesaikan</span><span class="hero-emoji">${m.reward.split(' ')[0]}</span><h2>Anda mendapat ${safe(m.reward.slice(3))}!</h2><p>Anda menyelesaikan semua cabaran di <strong>${safe(m.place)}</strong>.</p><div class="score">${thisScore}/3</div><p class="small">Markah misi ini. Setiap kesalahan ialah peluang untuk belajar.</p><div class="actions"><button class="primary" id="advance">${stage===2?'Lihat Keputusan Akhir →':'Buka Pintu Seterusnya →'}</button></div></div>`;document.getElementById('advance').addEventListener('click',()=>{if(stage===2){results();}else{stage++;question=0;renderQuestion();}});}
function results(){stage=3;updateHeader();let msg=score===9?'Hebat! Anda Pakar Awalan meN-!':score>=6?'Syabas! Anda semakin mahir!':'Tahniah kerana berjaya menamatkan misi!';let suggestion=score===9?'Cuba permainan Detektif Imbuhan pula.':score>=6?'Semak semula soalan yang salah dan cuba lagi.':'Baca nota awalan meN- dan ulang permainan ini.';screen.innerHTML=`<div class="center"><span class="eyebrow">🏆 Misi Selesai</span><span class="hero-emoji">📖✨</span><h2>${safe(msg)}</h2><p>Ketiga-tiga kunci berjaya dikumpulkan. Peti rahsia perpustakaan kini terbuka!</p><div class="score">${score}/9</div><div class="badge-list"><span class="reward">🔵 Kunci Biru</span><span class="reward">🟡 Kunci Emas</span><span class="reward">🟣 Kunci Rahsia</span></div><div class="scene"><span class="emoji">🎁</span><p><strong>Buku Rahsia Ditemui!</strong><br>${safe(suggestion)}</p></div><div class="actions"><button class="primary" id="restart">Cuba Lagi ↻</button></div></div>`;document.getElementById('restart').addEventListener('click',start);}
intro();
</script>
</body>
</html>
